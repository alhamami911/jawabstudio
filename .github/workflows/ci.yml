name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Syntax-check scripts
        run: for f in scripts/*.mjs scripts/*/*.mjs; do node --check "$f"; done
      - name: Block committed secrets and media
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|\.(wav|mp3|webm)$|^(output|library|cache|data|voice-backup)/'
